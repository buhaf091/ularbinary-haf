<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3" />

  <!-- Binary Background Grid Lines -->
  <g opacity="0.12" stroke="#34d399" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Binary Watermark Pattern -->
  <g fill="#10b981" opacity="0.15" font-family="monospace" font-size="28" font-weight="bold">
    <text x="80" y="100">0 1 0 1</text>
    <text x="320" y="100">1 1 0 0</text>
    <text x="80" y="440">1 0 1 0</text>
    <text x="320" y="440">0 0 1 1</text>
  </g>

  <!-- Snake Body Segments -->
  <g filter="url(#glow)">
    <!-- Tail to Body Path -->
    <rect x="96" y="280" width="48" height="48" rx="12" fill="url(#snakeGrad)" />
    <rect x="144" y="280" width="48" height="48" rx="12" fill="url(#snakeGrad)" />
    <rect x="192" y="280" width="48" height="48" rx="12" fill="url(#snakeGrad)" />
    <rect x="192" y="232" width="48" height="48" rx="12" fill="url(#snakeGrad)" />
    <rect x="192" y="184" width="48" height="48" rx="12" fill="url(#snakeGrad)" />
    <rect x="240" y="184" width="48" height="48" rx="12" fill="url(#snakeGrad)" />
    <rect x="288" y="184" width="56" height="56" rx="16" fill="#10b981" stroke="#a7f3d0" stroke-width="3" />

    <!-- Snake Head Eyes -->
    <circle cx="316" cy="200" r="6" fill="#0f172a" />
    <circle cx="318" cy="198" r="2" fill="#ffffff" />
    <circle cx="332" cy="200" r="6" fill="#0f172a" />
    <circle cx="334" cy="198" r="2" fill="#ffffff" />

    <!-- Cute Crown on Head -->
    <path d="M 298 174 L 306 182 L 316 172 L 326 182 L 334 174 L 332 186 L 300 186 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
  </g>

  <!-- Apple Target with glow -->
  <g filter="url(#glow)">
    <!-- Leaf & Stem -->
    <path d="M 390 240 Q 394 220 405 215" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
    <ellipse cx="406" cy="225" rx="12" ry="6" transform="rotate(-30 406 225)" fill="#22c55e" />
    <!-- Apple Body -->
    <path d="M 390 245 C 365 245 355 270 355 295 C 355 330 380 345 390 345 C 400 345 425 330 425 295 C 425 270 415 245 390 245 Z" fill="url(#appleGrad)" />
    <circle cx="375" cy="270" r="5" fill="#fecaca" opacity="0.6" />
    <!-- Binary "1" on apple -->
    <text x="390" y="306" font-family="monospace" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
  </g>

  <!-- App Title Banner -->
  <text x="256" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">ULAR BINER</text>
  <text x="256" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="1">SMKS PURNAMA GEMPOL</text>
</svg>
